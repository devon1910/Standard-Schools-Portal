name: Production migrations and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, migrate, and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: portal_test
          POSTGRES_DB: portal_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_test -d portal_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check required configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name secret in the GitHub production environment."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Check types
        run: |
          npx next typegen
          npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test migrations on a disposable database
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://portal_test:portal_test@127.0.0.1:5432/portal_migration_test
        run: npm run test:migrations

      - name: Reject an outdated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "::error::A newer commit is on main. Run the workflow for that commit instead."
            exit 1
          fi

      - name: Apply production migrations and deploy on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
